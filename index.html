<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G F Khan Invoice</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  margin:0;
  padding:20px;
  background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
  color:#fff;
}

/* CONTAINER */

.container{
  max-width:820px;
  margin:auto;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.08);
  padding:24px;
  border-radius:24px;
}

/* TITLE */

h2{
  text-align:center;
  margin-bottom:20px;
}

/* INPUTS */

input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.08);
  color:#fff;
  outline:none;
  font-size:14px;
}

input::placeholder{
  color:#ddd;
}

/* DATE */

.date-row{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:10px;
}

.date-box{
  flex:1;
  min-width:200px;
}

.date-box label{
  display:block;
  margin-bottom:6px;
  font-weight:700;
}

/* ITEM ROW */

.item-row{
  display:grid;
  grid-template-columns:1fr 80px 100px 110px;
  gap:8px;
  margin-bottom:10px;
  align-items:center;
}

/* BUTTONS */

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  color:#fff;
  font-weight:700;
  cursor:pointer;
  margin-top:10px;
}

.generate{background:#4f6fd9;}
.add{background:#6fa79a;}
.pdf{background:#8ea2b8;}
.print{background:#00a37a;}
.save{background:#f0a35a;}
.email{background:#b24cd6;}
.new{background:#444;}

.remove{
  background:#ff4f4f;
  margin-top:0;
  font-size:12px;
}

/* GRID */

.button-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

/* INVOICE */

.invoice{
  margin-top:24px;
  background:#fff;
  color:#111;
  border-radius:18px;
  padding:24px;
  display:none;
  width:100%;
}

/* TITLE */

.title{
  font-size:34px;
  font-weight:700;
  color:#0b3c6d;
  margin-bottom:12px;
}

/* COMPANY */

.company-name{
  font-size:18px;
  font-weight:700;
  margin-bottom:10px;
}

/* DETAILS */

.details{
  font-size:14px;
  line-height:1.4;
  margin-bottom:18px;
}

.details p{
  margin:6px 0;
}

/* BILL TO */

.bill-heading{
  font-size:20px;
  font-weight:700;
  color:#0b3c6d;
  margin-top:18px;
  margin-bottom:6px;
}

.bill-name{
  font-size:18px;
  margin-bottom:12px;
}

/* TABLE */

table{
  width:100%;
  border-collapse:collapse;
  margin-top:14px;
}

th{
  text-align:left;
  padding:10px 0;
  border-bottom:1px solid #ccc;
  color:#0b3c6d;
  font-size:22px; /* BIGGER PRODUCT HEADINGS */
  font-weight:700;
}

td{
  padding:12px 0;
  border-bottom:1px solid #eee;
  font-size:20px; /* BIGGER PRODUCT DETAILS */
  font-weight:500;
}

/* TOTAL */

.total{
  margin-top:18px;
  text-align:right;
  font-size:24px;
  font-weight:700;
}

/* BANK */

.bank{
  margin-top:18px;
  border:2px solid #0b3c6d;
  padding:10px 14px;
  border-radius:12px;
}

.bank p{
  margin:4px 0;
  font-size:10px; /* SMALLER ACCOUNT DETAILS */
  line-height:1.4;
}

/* THANK */

.thank{
  text-align:center;
  font-size:34px;
  color:#0b3c6d;
  font-family:'Great Vibes',cursive;
  margin-top:18px;
}

/* MOBILE */

@media(max-width:600px){

  .item-row{
    grid-template-columns:1fr;
  }

  .button-grid{
    grid-template-columns:1fr;
  }

  .invoice{
    padding:16px;
  }

  th{
    font-size:16px;
  }

  td{
    font-size:15px;
  }

  .thank{
    font-size:28px;
  }
}

/* PRINT */

@media print{

  body *{
    visibility:hidden;
  }

  #output,
  #output *{
    visibility:visible;
  }

  #output{
    position:absolute;
    left:0;
    top:0;
    width:100%;
  }
}

</style>

</head>

<body>

<div class="container">

<h2>G F Khan Invoice</h2>

<input id="company" placeholder="Your Company Name">

<input id="billTo" placeholder="Bill To">

<input id="invoiceNo" placeholder="Invoice Number">

<div class="date-row">

  <div class="date-box">
    <label>Invoice Date</label>
    <input id="date" type="date">
  </div>

  <div class="date-box">
    <label>Due Date</label>
    <input id="due" type="date">
  </div>

</div>

<h3>Items</h3>

<div id="items"></div>

<button class="generate" onclick="generateInvoice()">
  ⚙ Generate Invoice
</button>

<button class="add" onclick="addItem()">
  + Add Item
</button>

<div class="button-grid">

  <button class="pdf" onclick="saveAsPDF()">
    📄 Save PDF
  </button>

  <button class="print" onclick="printInvoice()">
    🖨 Print
  </button>

</div>

<div class="button-grid">

  <button class="save" onclick="savePNG()">
    📥 Save PNG
  </button>

  <button class="email" onclick="emailInvoice()">
    ✉ Email PDF
  </button>

</div>

<button class="new" onclick="newInvoice()">
  📄 New Invoice
</button>

<div id="output" class="invoice"></div>

</div>

<script>

/* ADD ITEM */

function addItem(){

  const row=document.createElement('div');

  row.className='item-row';

  row.innerHTML=`
    <input placeholder="Description">
    <input type="number" placeholder="Qty">
    <input type="number" placeholder="Price">
    <button class="remove" onclick="this.parentElement.remove()">
      Remove
    </button>
  `;

  document.getElementById('items').appendChild(row);
}

addItem();

/* DATE FORMAT */

function formatDate(d){

  if(!d) return "";

  return new Date(d).toLocaleDateString('en-GB',{

    day:'2-digit',
    month:'short',
    year:'numeric'

  });
}

/* GENERATE INVOICE */

function generateInvoice(){

  const output=document.getElementById('output');

  output.style.display='block';

  const rows=document.querySelectorAll('.item-row');

  let tableRows='';

  let total=0;

  rows.forEach(row=>{

    const i=row.querySelectorAll('input');

    const desc=i[0].value;

    const qty=parseFloat(i[1].value)||0;

    const price=parseFloat(i[2].value)||0;

    const amount=qty*price;

    total+=amount;

    tableRows+=`
      <tr>
        <td>${qty}</td>
        <td>${desc}</td>
        <td>£${price.toFixed(2)}</td>
        <td>£${amount.toFixed(2)}</td>
      </tr>
    `;
  });

  output.innerHTML=`

    <div class="title">INVOICE</div>

    <div class="company-name">${company.value}</div>

    <div class="details">

      <p><strong>Invoice:</strong> ${invoiceNo.value}</p>

      <p><strong>Invoice Date:</strong> ${formatDate(date.value)}</p>

      <p><strong>Due Date:</strong> ${formatDate(due.value)}</p>

    </div>

    <div class="bill-heading">Bill To</div>

    <div class="bill-name">${billTo.value}</div>

    <table>

      <tr>
        <th>Qty</th>
        <th>Description</th>
        <th>Price</th>
        <th>Total</th>
      </tr>

      ${tableRows}

    </table>

    <div class="total">
      Total £${total.toFixed(2)}
    </div>

    <div class="bank">

      <p><strong>Account Name:</strong> G F Khan</p>

      <p><strong>Sort Code:</strong> 20-11-88</p>

      <p><strong>Account No:</strong> 60519251</p>

    </div>

    <div class="thank">
      Thank you
    </div>

  `;
}

/* PRINT */

function printInvoice(){
  window.print();
}

/* SAVE PNG */

async function savePNG(){

  const element=document.getElementById('output');

  if(element.innerHTML.trim()===""){
    alert("Please generate invoice first");
    return;
  }

  const invoiceName=invoiceNo.value.trim() || "Invoice";

  const canvas=await html2canvas(element,{
    scale:1.5,
    useCORS:true
  });

  const link=document.createElement('a');

  link.download=invoiceName + ".png";

  link.href=canvas.toDataURL("image/png");

  link.click();
}

/* SAVE PDF */

async function saveAsPDF(){

  const element=document.getElementById('output');

  if(element.innerHTML.trim()===""){
    alert("Please generate invoice first");
    return;
  }

  const invoiceName=invoiceNo.value.trim() || "Invoice";

  const opt={

    margin:[5,5,5,5],

    filename:invoiceName + ".pdf",

    image:{
      type:'jpeg',
      quality:0.98
    },

    html2canvas:{
      scale:1.2,
      useCORS:true,
      logging:false
    },

    jsPDF:{
      unit:'mm',
      format:'a4',
      orientation:'portrait'
    }

  };

  await html2pdf()
    .set(opt)
    .from(element)
    .save();
}

/* EMAIL PDF */

async function emailInvoice(){

  const element=document.getElementById('output');

  if(element.innerHTML.trim()===""){
    alert("Please generate invoice first");
    return;
  }

  const invoiceName=invoiceNo.value.trim() || "Invoice";

  const worker = html2pdf().set({

    margin:[5,5,5,5],

    filename:invoiceName + ".pdf",

    image:{
      type:'jpeg',
      quality:0.98
    },

    html2canvas:{
      scale:1.2,
      useCORS:true,
      logging:false
    },

    jsPDF:{
      unit:'mm',
      format:'a4',
      orientation:'portrait'
    }

  }).from(element);

  const pdfBlob = await worker.outputPdf('blob');

  const file = new File(
    [pdfBlob],
    invoiceName + ".pdf",
    {type:"application/pdf"}
  );

  if(navigator.canShare && navigator.canShare({files:[file]})){

    await navigator.share({
      files:[file],
      title:invoiceName
    });

  }else{

    alert("Sharing not supported on this device.");
  }
}

/* RESET */

function newInvoice(){

  company.value="";
  billTo.value="";
  invoiceNo.value="";
  date.value="";
  due.value="";

  document.getElementById('items').innerHTML='';

  addItem();

  const output=document.getElementById('output');

  output.innerHTML='';

  output.style.display='none';
}

</script>

</body>
</html>
