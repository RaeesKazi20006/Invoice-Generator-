<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice App</title>

<link rel="stylesheet" href="style.css">

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

<div class="container">

<h2>Invoice App</h2>

<button class="theme-btn" onclick="toggleTheme()">🌗 Theme</button>

<input id="company" placeholder="Company Name">
<input id="billTo" placeholder="Bill To">
<input id="invoiceNo" placeholder="Invoice Number">

<div class="date-row">
  <input id="date" type="date">
  <input id="due" type="date">
</div>

<h3>Items</h3>
<div id="items"></div>

<button onclick="addItem()">+ Add Item</button>
<button class="generate" onclick="generateInvoice()">Generate</button>

<button onclick="saveAsPDF()">Save PDF</button>
<button onclick="savePNG()">Save PNG</button>

<button onclick="newInvoice()">New</button>

</div>

<div id="printArea" class="print-area"></div>

<script src="script.js"></script>

</body>
</html>
