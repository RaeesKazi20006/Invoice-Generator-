<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G F Khan Invoice </title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  margin:0;
  padding:20px;
  min-height:100vh;
  background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
  color:#fff;
}

/* CONTAINER */

.container{
  max-width:650px;
  margin:auto;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.08);
  padding:24px;
  border-radius:24px;
  box-shadow:0 8px 32px rgba(0,0,0,0.35);
}

/* HEADING */

h2{
  text-align:center;
  color:#fff;
  font-size:24px;
  margin-bottom:22px;
  font-weight:800;
}

/* INPUTS */

input{
  width:100%;
  padding:13px;
  margin:6px 0;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.15);
  font-weight:700;
  font-size:14px;
  color:#fff;
  background:rgba(255,255,255,0.08);
  outline:none;
}

input::placeholder{
  color:#ddd;
}

/* DATE SECTION */

.date-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  margin-top:12px;
  width:100%;
  flex-wrap:wrap;
}

.date-box{
  width:100%;
  max-width:220px;
}

.date-box label{
  display:block;
  margin-bottom:6px;
  font-weight:700;
  color:#fff;
  font-size:14px;
  text-align:center;
}

.date-box input{
  text-align:center;
}

/* ITEMS */

h3{
  color:#fff;
  margin-top:18px;
}

/* ITEM ROW */

.item-row{
  display:grid;
  grid-template-columns:1fr 70px 90px 120px;
  gap:6px;
  margin-bottom:10px;
  align-items:center;
}

/* BUTTONS */

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:14px;
  color:#fff;
  cursor:pointer;
  font-weight:700;
  font-size:15px;
  transition:0.2s;
}

button:hover{
  transform:translateY(-2px);
}

/* BUTTON COLORS */

.generate{
  background:#4f6fd9;
}

.print{
  background:#00a37a;
}

.add{
  background:#6fa79a;
}

.save{
  background:#f0a35a;
}

.pdf{
  background:#8ea2b8;
}

.new{
  background:#444;
}

.email{
  background:#b24cd6;
}

.remove{
  background:#ff4f4f;
  font-size:12px;
  padding:10px;
}

/* BUTTON GRID */

.button-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

/* ACTIONS */

.actions{
  display:flex;
  flex-direction:column;
}

/* INVOICE OUTPUT */

.invoice{
  margin-top:24px;
  padding:24px;
  background:#fff;
  border-radius:18px;
  color:#111;
  display:none;
  width:100%;
  max-width:100%;
  overflow:hidden;
}

.title{
  font-size:26px;
  font-weight:700;
  color:#0b3c6d;
}

table{
  width:100%;
  margin-top:15px;
  border-collapse:collapse;
  font-size:12px;
}

th{
  text-align:left;
  color:#0b3c6d;
  border-bottom:1px solid #ddd;
  padding-bottom:6px;
}

td{
  padding:8px 0;
  border-bottom:1px solid #f1f1f1;
  word-break:break-word;
}

.total{
  margin-top:20px;
  display:flex;
  justify-content:flex-end;
  font-weight:700;
  border-top:1px solid #ddd;
  padding-top:10px;
  font-size:18px;
  width:100%;
  overflow-wrap:break-word;
}

.bank{
  margin-top:20px;
  border:2px solid #0b3c6d;
  padding:14px;
  border-radius:12px;
  width:100%;
  overflow-wrap:break-word;
}

.thank{
  font-family:'Great Vibes',cursive;
  font-size:34px;
  margin-top:24px;
  color:#0b3c6d;
  text-align:center;
}

/* MOBILE */

@media (max-width:600px){

  .container{
    padding:16px;
  }

  .date-row{
    flex-direction:column;
  }

  .date-box{
    max-width:200px;
  }

  .item-row{
    grid-template-columns:1fr;
  }

  .button-grid{
    grid-template-columns:1fr;
  }

  .remove{
    width:100%;
  }

  .invoice{
    padding:14px;
  }

  table{
    font-size:11px;
  }

  td,th{
    word-break:break-word;
  }

  .generate{order:1;}
  .add{order:2;}
  .button-grid:nth-of-type(1){order:3;}
  .button-grid:nth-of-type(2){order:4;}
  .new{order:5;}
}

/* PRINT */

@media print{

  body *{
    visibility:hidden;
  }

  #output,
  #output *{
    visibility:visible;
  }

  #output{
    position:absolute;
    top:0;
    left:0;
    width:100%;
  }

  button,
  input,
  label{
    display:none;
  }
}

</style>

</head>

<body>

<div class="container">

<h2>G F Khan Invoice</h2>

<input id="company" placeholder="Your Company Name">

<input id="billTo" placeholder="Bill To">

<input id="invoiceNo" placeholder="Invoice Number">

<!-- DATE -->

<div class="date-row">

  <div class="date-box">
    <label>Invoice Date</label>
    <input id="date" type="date">
  </div>

  <div class="date-box">
    <label>Due Date</label>
    <input id="due" type="date">
  </div>

</div>

<h3>Items</h3>

<div id="items"></div>

<!-- BUTTONS -->

<div class="actions">

  <button class="generate" onclick="generateInvoice()">
    ⚙ Generate Invoice
  </button>

  <button class="add" onclick="addItem()">
    + Add Item
  </button>

  <div class="button-grid">

    <button class="pdf" onclick="saveAsPDF()">
      📄 Save PDF
    </button>

    <button class="print" onclick="printInvoice()">
      🖨 Print
    </button>

  </div>

  <div class="button-grid">

    <button class="save" onclick="saveOnPhone()">
      📥 Save to Phone
    </button>

    <button class="email" onclick="emailInvoice()">
      ✉ Email
    </button>

  </div>

  <button class="new" onclick="newInvoice()">
    📄 New Invoice
  </button>

</div>

<!-- OUTPUT -->

<div id="output" class="invoice"></div>

</div>

<script>

/* ADD ITEM */

function addItem(){

  const container=document.getElementById('items');

  const row=document.createElement('div');

  row.className='item-row';

  row.innerHTML=`
    <input placeholder="Description">
    <input type="number" placeholder="Qty">
    <input type="number" placeholder="Price">
    <button class="remove" onclick="this.parentElement.remove()">
      Remove Item
    </button>
  `;

  container.appendChild(row);
}

addItem();

/* DATE FORMAT */

function formatDate(d){

  if(!d) return "";

  return new Date(d).toLocaleDateString('en-GB',{

    day:'2-digit',
    month:'short',
    year:'numeric'

  });
}

/* GENERATE INVOICE */

function generateInvoice(){

  document.getElementById('output').style.display='block';

  const rows=document.querySelectorAll('.item-row');

  let tableRows='';

  let total=0;

  rows.forEach(row=>{

    const i=row.querySelectorAll('input');

    const desc=i[0].value;

    const qty=parseFloat(i[1].value)||0;

    const price=parseFloat(i[2].value)||0;

    const amount=qty*price;

    total+=amount;

    tableRows+=`

      <tr>

        <td>${qty}</td>

        <td>${desc}</td>

        <td>£${price.toFixed(2)}</td>

        <td>£${amount.toFixed(2)}</td>

      </tr>

    `;
  });

  document.getElementById('output').innerHTML=`

    <div class="title">INVOICE</div>

    <p><strong>${company.value}</strong></p>

    <p><strong>Invoice:</strong> ${invoiceNo.value}</p>

    <p><strong>Invoice Date:</strong> ${formatDate(date.value)}</p>

    <p><strong>Due Date:</strong> ${formatDate(due.value)}</p>

    <h3>Bill To</h3>

    <p>${billTo.value}</p>

    <table>

      <tr>

        <th>Qty</th>

        <th>Description</th>

        <th>Price</th>

        <th>Total</th>

      </tr>

      ${tableRows}

    </table>

    <div class="total">

      Total £${total.toFixed(2)}

    </div>

    <div class="bank">

      <p><strong>Account Name:</strong> G F Khan</p>

      <p><strong>Sort Code:</strong> 20-11-88</p>

      <p><strong>Account No:</strong> 60519251</p>

    </div>

    <div class="thank">

      Thank you

    </div>

  `;
}

/* PRINT */

function printInvoice(){

  window.print();
}

/* SAVE PNG */

async function saveOnPhone(){

  let invoiceName=invoiceNo.value.trim();

  if(invoiceName===""){
    invoiceName="Invoice";
  }

  const canvas=await html2canvas(
    document.getElementById('output'),
    {
      scale:2
    }
  );

  canvas.toBlob(async(blob)=>{

    const file=new File(
      [blob],
      invoiceName + ".png",
      {type:"image/png"}
    );

    if(navigator.canShare && navigator.canShare({files:[file]})){

      await navigator.share({
        files:[file],
        title:invoiceName
      });

    }else{

      const link=document.createElement('a');

      link.download=invoiceName + ".png";

      link.href=URL.createObjectURL(blob);

      link.click();
    }

  });
}

/* SAVE PDF */

async function saveAsPDF(){

  const element=document.getElementById('output');

  let invoiceName=invoiceNo.value.trim();

  if(invoiceName===""){
    invoiceName="Invoice";
  }

  element.style.width="794px";
  element.style.maxWidth="794px";

  const opt={

    margin:[5,5,5,5],

    filename:invoiceName + ".pdf",

    image:{
      type:'jpeg',
      quality:1
    },

    html2canvas:{
      scale:2,
      useCORS:true,
      logging:false,
      scrollX:0,
      scrollY:0
    },

    jsPDF:{
      unit:'mm',
      format:'a4',
      orientation:'portrait'
    }

  };

  await html2pdf()
    .set(opt)
    .from(element)
    .save();

  element.style.width="100%";
  element.style.maxWidth="100%";
}

/* EMAIL WITH PDF ATTACHMENT */

async function emailInvoice(){

  let invoiceName=invoiceNo.value.trim();

  if(invoiceName===""){
    invoiceName="Invoice";
  }

  const element=document.getElementById('output');

  element.style.width="794px";
  element.style.maxWidth="794px";

  const pdfBlob=await html2pdf()
    .set({

      margin:[5,5,5,5],

      filename:invoiceName + ".pdf",

      image:{
        type:'jpeg',
        quality:1
      },

      html2canvas:{
        scale:2,
        useCORS:true
      },

      jsPDF:{
        unit:'mm',
        format:'a4',
        orientation:'portrait'
      }

    })
    .from(element)
    .outputPdf('blob');

  element.style.width="100%";
  element.style.maxWidth="100%";

  const file=new File(
    [pdfBlob],
    invoiceName + ".pdf",
    {type:"application/pdf"}
  );

  if(navigator.canShare && navigator.canShare({files:[file]})){

    await navigator.share({

      files:[file],

      title:invoiceName,

      text:`Hi,

Please find the attached invoice ${invoiceName}.

Best Regards,
G F Khan`

    });

  }else{

    alert("Your browser does not support direct email attachment sharing.");
  }
}

/* RESET */

function newInvoice(){

  company.value="";
  billTo.value="";
  invoiceNo.value="";
  date.value="";
  due.value="";

  document.getElementById('items').innerHTML='';

  addItem();

  document.getElementById('output').innerHTML='';

  document.getElementById('output').style.display='none';
}

</script>

</body>
</html>
