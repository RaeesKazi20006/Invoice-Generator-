<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G F Khan Invoice Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* --- APP THEME (DARK MODE) --- */
        body {
            background-color: #222831;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-container {
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            font-weight: 700;
            margin-bottom: 25px;
        }
        label {
            display: block;
            font-weight: bold;
            margin: 15px 0 5px 0;
        }
        input {
            width: 100%;
            padding: 14px;
            background-color: #393E46;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        input:focus {
            outline: 2px solid #4F709C;
        }
        .date-row {
            display: flex;
            gap: 15px;
        }
        .date-group {
            flex: 1;
        }
        
        /* --- ITEM BLOCK ROW --- */
        .item-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }
        .flex-desc { flex: 4; }
        .flex-qty { flex: 1.5; }
        .flex-price { flex: 2; }
        
        /* --- BUTTONS --- */
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        .btn-generate { background-color: #4F709C; }
        .btn-add { background-color: #6A9C89; }
        .btn-remove { background-color: #FF4D4D; width: auto; padding: 14px; margin-top: 0; }
        .btn-grid { display: flex; gap: 10px; width: 100%; }
        .btn-grid button { flex: 1; }
        .btn-pdf { background-color: #8EA7E9; }
        .btn-print { background-color: #00ADB5; }
        .btn-png { background-color: #E5BA73; }
        .btn-email { background-color: #B8621B; }
        .btn-new { background-color: #393E46; }

        /* --- SCREEN PREVIEW STYLING (Appears directly below the form page) --- */
        #preview-section {
            display: none; /* Only reveals when clicking 'Generate' */
            width: 100%;
            max-width: 500px;
            background-color: white;
            color: black;
            margin-top: 30px;
            padding: 30px 20px;
            border-radius: 12px;
            box-sizing: border-box;
            box-shadow: 0px 4px 20px rgba(0,0,0,0.3);
        }

        .invoice-title {
            font-size: 34px;
            font-weight: bold;
            color: #0F3D5E;
            margin-bottom: 20px;
            font-family: 'Inter', sans-serif;
        }
        .company-name {
            font-size: 18px;
            font-weight: bold;
            color: #0F3D5E;
            margin-bottom: 5px;
        }
        .meta-info {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
            color: #333;
        }
        .bill-to-title {
            font-size: 24px;
            color: #0F3D5E;
            margin-bottom: 5px;
        }
        .bill-to-name {
            font-size: 16px;
            color: #0F3D5E;
            margin-bottom: 25px;
        }
        .invoice-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        .invoice-table th {
            color: #0F3D5E;
            text-align: left;
            font-weight: bold;
            padding-bottom: 10px;
            border-bottom: 2px solid #0F3D5E;
        }
        .invoice-table td {
            padding: 10px 0;
            vertical-align: top;
            color: #222;
        }
        .col-qty { width: 12%; }
        .col-desc { width: 48%; }
        .col-price { width: 20%; }
        .col-amt { width: 20%; }

        .total-wrapper {
            text-align: right;
            font-size: 18px;
            font-weight: bold;
            color: #0F3D5E;
            margin-bottom: 35px;
        }
        .total-wrapper span {
            margin-left: 25px;
        }
        .bank-box {
            border: 1px solid black;
            display: inline-block;
            padding: 10px;
            font-size: 11px;
            line-height: 1.5;
            margin-bottom: 35px;
            color: #000;
        }
        .thank-you {
            font-family: 'Alex Brush', cursive;
            font-size: 42px;
            color: #0F3D5E;
            margin-top: 10px;
        }

        /* --- HARDWARE SYSTEM PRINT OVERRIDES --- */
        @media print {
            @page {
                size: auto;
                margin: 15mm 10mm; /* Eliminates browser URL headers/footers */
            }
            body {
                background-color: white !important;
                padding: 0;
            }
            .app-container {
                display: none !important; /* Whitelist hiding the dark data input block */
            }
            #preview-section {
                display: block !important;
                box-shadow: none !important;
                margin-top: 0 !important;
                padding: 0 !important;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h2>G F Khan Invoice</h2>
        
        <input type="text" id="form-company" value="Ghulam Farooq Khan" placeholder="Your Company Name">
        <input type="text" id="form-billto" placeholder="Bill To">
        <input type="text" id="form-invnumber" placeholder="Invoice Number">

        <div class="date-row">
            <div class="date-group">
                <label>Invoice Date</label>
                <input type="date" id="form-date">
            </div>
            <div class="date-group">
                <label>Due Date</label>
                <input type="date" id="form-duedate">
            </div>
        </div>

        <label>Items</label>
        <div id="items-container">
            </div>

        <button class="btn-generate" onclick="showLivePreviewOnScreen()">⚙ Generate Invoice</button>
        <button class="btn-add" onclick="addItemRow()">+ Add Item</button>
        
        <div class="btn-grid">
            <button class="btn-pdf" onclick="downloadNamedPDF()">📄 Save PDF</button>
            <button class="btn-print" onclick="triggerCleanSystemPrint()">🖨 Print</button>
        </div>
        <div class="btn-grid">
            <button class="btn-png" onclick="downloadNamedPDF()">📥 Save PNG</button>
            <button class="btn-email" onclick="triggerEmail()">✉ Email PDF</button>
        </div>
        <button class="btn-new" onclick="resetForm()">📄 New Invoice</button>
    </div>

    <div id="preview-section">
        <div class="invoice-title">INVOICE</div>
        <div class="company-name" id="out-company"></div>
        <div class="meta-info">
            <div>Invoice: <span id="out-num"></span></div>
            <div>Invoice Date: <span id="out-date"></span></div>
            <div>Due Date: <span id="out-duedate"></span></div>
        </div>

        <div class="bill-to-title">Bill To</div>
        <div class="bill-to-name" id="out-billto"></div>

        <table class="invoice-table">
            <thead>
                <tr>
                    <th class="col-qty">Qty</th>
                    <th class="col-desc">Description</th>
                    <th class="col-price">Unit Price</th>
                    <th class="col-amt">Amount</th>
                </tr>
            </thead>
            <tbody id="out-table-body">
                </tbody>
        </table>

        <div class="total-wrapper">
            Total <span><strong id="out-total">£0</strong></span>
        </div>

        <div class="bank-box">
            Account Name: G F Khan<br>
            Sort Code: 20-11-88<br>
            Account Number: 60519251
        </div>

        <div class="thank-you">Thank you</div>
    </div>

    <script>
        function addItemRow() {
            const container = document.getElementById('items-container');
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <input type="text" class="flex-desc item-desc" placeholder="Description">
                <input type="number" class="flex-qty item-qty" placeholder="Qty" value="1">
                <input type="number" class="flex-price item-price" placeholder="Price">
                <button class="btn-remove" onclick="this.parentElement.remove()">Remove</button>
            `;
            container.appendChild(row);
        }

        // Initialize with default row
        addItemRow();

        function formatDate(dateString) {
            if(!dateString) return '';
            const d = new Date(dateString);
            return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth()+1).padStart(2, '0')}/${d.getFullYear()}`;
        }

        // Compiles data directly into the preview area
        function buildInvoiceStructure() {
            const invoiceNum = document.getElementById('form-invnumber').value || "Draft";
            
            document.getElementById('out-company').innerText = document.getElementById('form-company').value;
            document.getElementById('out-billto').innerText = document.getElementById('form-billto').value;
            document.getElementById('out-num').innerText = invoiceNum;
            document.getElementById('out-date').innerText = formatDate(document.getElementById('form-date').value);
            document.getElementById('out-duedate').innerText = formatDate(document.getElementById('form-duedate').value);

            const rows = document.querySelectorAll('.item-row');
            const tbody = document.getElementById('out-table-body');
            tbody.innerHTML = '';
            let finalTotal = 0;

            rows.forEach(row => {
                const desc = row.querySelector('.item-desc').value;
                const qty = parseInt(row.querySelector('.item-qty').value) || 0;
                const price = parseFloat(row.querySelector('.item-price').value) || 0;
                const amount = qty * price;
                finalTotal += amount;

                if(desc) {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${qty}</td>
                        <td style="white-space: pre-line;">${desc}</td>
                        <td>£${price.toFixed(0)}</td>
                        <td>£${amount.toFixed(0)}</td>
                    `;
                    tbody.appendChild(tr);
                }
            });

            document.getElementById('out-total').innerText = `£${finalTotal.toFixed(0)}`;
            return invoiceNum;
        }

        // Action 1: Show layout on screen only without triggered file prompts
        function showLivePreviewOnScreen() {
            buildInvoiceStructure();
            document.getElementById('preview-section').style.display = 'block';
            
            // Scroll down automatically to view the newly built layout smoothly
            document.getElementById('preview-section').scrollIntoView({ behavior: 'smooth' });
        }

        // Action 2: PDF Button functionality matching your specific Invoice Title names
        function downloadNamedPDF() {
            const invoiceNumber = buildInvoiceStructure();
            const element = document.getElementById('preview-section');
            
            // Temporary reveal element to allow html2pdf package tracking
            const originalDisplay = element.style.display;
            element.style.display = 'block';

            const options = {
                margin:       12,
                filename:     `invoice_${invoiceNumber}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(options).from(element).save().then(() => {
                element.style.display = originalDisplay;
            });
        }

        // Action 3: Hardware Print Engine call handler
        function triggerCleanSystemPrint() {
            buildInvoiceStructure();
            window.print();
        }

        function triggerEmail() {
            const subject = encodeURIComponent("Invoice: " + document.getElementById('form-invnumber').value);
            window.location.href = `mailto:?subject=${subject}`;
        }

        function resetForm() {
            document.getElementById('form-billto').value = '';
            document.getElementById('form-invnumber').value = '';
            document.getElementById('form-date').value = '';
            document.getElementById('form-duedate').value = '';
            document.getElementById('items-container').innerHTML = '';
            document.getElementById('preview-section').style.display = 'none';
            addItemRow();
        }
    </script>
</body>
</html>
